# FitSync version catalog

[versions]
agp = "9.3.1"
kotlin = "2.4.10"
hilt = "2.60.1"
coroutines = "1.8.1"
room = "2.8.5"
okhttp = "4.12.0"
tink = "1.6.1"
composeBom = "2026.09.00"
navigationCompose = "2.7.7"
lifecycle = "2.8.1"

[libraries]
# Miuix / HyperOS 组件库（与 HyperIsland 3.2.1 同版本）
miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui-android", version = "0.9.4" }
miuix-icons = { module = "top.yukonga.miuix.kmp:miuix-icons-android", version = "0.9.4" }
miuix-blur = { module = "top.yukonga.miuix.kmp:miuix-blur-android", version = "0.9.4" }
# AndroidX
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.13.1" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version = "1.9.1" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version = "2.8.1" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version = "2.8.1" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version = "2.8.1" }

# Test
junit = { module = "junit:junit", version = "4.13.2" }
robolectric = { module = "org.robolectric:robolectric", version = "4.12.2" }
androidx-test-core = { module = "androidx.test:core", version = "1.6.1" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version = "2.4.0" }
org-json = { module = "org.json:json", version = "20240303" }
# Garmin 官方 FIT SDK：生成合规的 monitoring FIT（健康数据搬运要用）
garmin-fit = { module = "com.garmin:fit", version = "21.176.0" }

# Compose
compose-bom = { module = "androidx.compose:compose-bom", version = "2026.09.00" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material = { module = "androidx.compose.material:material" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version = "2.7.7" }

# Room
room-runtime = { module = "androidx.room:room-runtime", version = "2.8.5" }
room-ktx = { module = "androidx.room:room-ktx", version = "2.8.5" }
room-compiler = { module = "androidx.room:room-compiler", version = "2.8.5" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version = "2.59.2" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version = "2.59.2" }

# Coroutines
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version = "1.8.1" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version = "1.8.1" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version = "1.8.1" }

# WorkManager
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version = "2.9.0" }

# Network & Crypto
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "4.12.0" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version = "4.12.0" }
tink = { module = "com.google.crypto.tink:tink", version = "1.6.1" }
security-crypto = { module = "androidx.security:security-crypto", version = "1.1.0-alpha06" }

[plugins]
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }